format = """
$directory\
$git_branch\
$git_state\
$git_status\
$fill\
$python\
$golang\
$aws\
$docker_context\
$time\
$jobs\
$cmd_duration\
$line_break\
$character"""

add_newline = true
# palette = 'nord'

[directory]
# style = 'bold fg:dark_blue'
format = '[$path ]($style)'
truncation_length = 3
truncation_symbol = '…/'
truncate_to_repo = false

[directory.substitutions]
'Documents' = '󰈙'
'Downloads' = ' '
'Music' = ' '
'Pictures' = ' '

[git_branch]
style = 'fg:green'
symbol = ' '
format = '[$symbol$branch ]($style)'

[git_status]
style = 'fg:green'
format = '([$all_status $ahead_behind]($style) )'
ahead = '⇡${count}'
diverged = '⇡${ahead_count}⇣${behind_count}'
behind = '⇣${count}'
untracked = '[?${count} ](white)'
deleted = '[×${count} ](red)'
modified= '[!${count} ](blue)'
staged= '[+${count} ](green)'
up_to_date = "✓"

[git_state]
rebase = 'rebasing'
merge = 'merging'
revert = 'reverting'
cherry_pick = 'cherry-picking'
style = 'yellow'

[fill]
symbol = ' '

[python]
style = 'yellow'
format = '[(\($virtualenv\) )]($style)'
pyenv_prefix = ''

[aws]
symbol = ' '
style = 'yellow'
format = '[$symbol($profile )(\[$duration\] )]($style)'

[time]
disabled = false
style = 'yellow'
format = '[$time]($style) '

[jobs]
symbol = ' '
style = 'red'
number_threshold = 1
format = '[$symbol]($style)'

[cmd_duration]
min_time = 500
style = 'fg:gray'
format = '[$duration]($style)'

[palettes.nord]
dark_blue = '#5E81AC'
blue = '#81A1C1'
teal = '#88C0D0'
red = '#BF616A'
orange = '#D08770'
green = '#A3BE8C'
yellow = '#EBCB8B'
purple = '#B48EAD'
gray = '#434C5E'
black = '#2E3440'
white='#D8DEE9'

[palettes.onedark]
dark_blue='#61afef'
blue='#56b6c2'
red='#e06c75'
green='#98c379'
purple='#c678dd'
cyan='#56b6c2'
orange='#be5046'
yellow='#e5c07b'
gray='#828997'
white ='#abb2bf'
black='#2c323c'
