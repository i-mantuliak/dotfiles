format = """
$directory\
$git_branch\
$git_state\
$git_status\
$fill\
$python\
$golang\
$aws\
$docker_context\
$time\
$jobs\
$cmd_duration\
$line_break\
$character"""

add_newline = true

[directory]
# style = 'bold fg:dark_blue'
format = '[$path ]($style)'
truncation_length = 3
truncation_symbol = '…/'
truncate_to_repo = false

[directory.substitutions]
'Documents' = '󰈙'
'Downloads' = ' '
'Music' = ' '
'Pictures' = ' '

[git_branch]
style = 'fg:green'
symbol = ' '
format = '[$symbol$branch ]($style)'

[git_status]
style = 'fg:green'
format = '([$all_status$ahead_behind]($style) )'
ahead = '⇡${count}'
diverged = '⇡${ahead_count}⇣${behind_count}'
behind = '⇣${count}'
untracked = '[?${count} ](blue)'
deleted = '[×${count} ](red)'
modified= '[!${count} ](yellow)'
staged= '[+${count} ](green)'
up_to_date = "✓"

[git_state]
rebase = 'rebasing'
merge = 'merging'
revert = 'reverting'
cherry_pick = 'cherry-picking'
style = 'yellow'

[fill]
symbol = ' '

[python]
style = 'yellow'
format = '[(\($virtualenv\) )]($style)'
pyenv_prefix = ''

[aws]
symbol = ' '
style = 'yellow'
format = '[$symbol($profile )(\[$duration\] )]($style)'

[time]
disabled = false
style = 'yellow'
format = '[$time]($style) '

[jobs]
symbol = ' '
style = 'red'
number_threshold = 1
format = '[$symbol]($style)'

[cmd_duration]
min_time = 500
style = 'fg:gray'
format = '[$duration]($style)'

