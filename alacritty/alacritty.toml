[env]
TERM = "xterm-256color"

[terminal]
osc52 = "CopyPaste"

[window]
padding.x = 25
padding.y = 25
opacity = 1
blur = true
dimensions = { columns = 150, lines = 53 }
decorations = "full"
dynamic_title = true

option_as_alt = "Both"

[font]
size = 14

[font.normal]
family = "JetBrainsMono Nerd Font"

[general]
live_config_reload = true

[selection]
save_to_clipboard = true

[keyboard]
bindings = [
    { key = "Left", mods = "Command", chars = "\u001B[H" },   # Move to the beginning of line
    { key = "Right", mods = "Command", chars = "\u001B[F" },  # Move to the end of line
    { key = "Left", mods = "Alt", chars = "\u001BB" },      # Go forward a word
    { key = "Right", mods = "Alt", chars = "\u001BF" },     # Go backward a word
    { key = "Back", mods = "Command", chars = "\u0015" },   # Delete line
    { key = "Back", mods = "Alt", chars = "\u001b\u007f" }, # Delete word
    # { key = "V", mods = "Control", action = "Paste" },
    { key = "Insert", mods = "Shift",   action = "Paste" },
    { key = "Insert", mods = "Control", action = "Copy"  },
]

# Colors (Gruvbox Material Hard Dark)
# Default colors
[colors.primary]
background = '#1d2021'
foreground = '#d4be98'

# Normal colors
[colors.normal]
black   = '#32302f'
red     = '#ea6962'
green   = '#a9b665'
yellow  = '#d8a657'
blue    = '#7daea3'
magenta = '#d3869b'
cyan    = '#89b482'
white   = '#d4be98'

# Bright colors (same as normal colors)
[colors.bright]
black   = '#32302f'
red     = '#ea6962'
green   = '#a9b665'
yellow  = '#d8a657'
blue    = '#7daea3'
magenta = '#d3869b'
cyan    = '#89b482'
white   = '#d4be98'
